// Ship Game — DarkPlaces defaults
unbindall
bind w "impulse 1"
bind s "impulse 2"
bind UPARROW "impulse 1"
bind DOWNARROW "impulse 2"
bind q "impulse 3"
bind e "impulse 4"
bind LEFTARROW "impulse 3"
bind RIGHTARROW "impulse 4"
bind SPACE "impulse 5"
bind f "impulse 5"
bind a "impulse 6"
bind x "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind 9 "impulse 9"
bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind ~ "toggleconsole"

name "Captain"
scr_conspeed "1000"
volume "0.6"
bgmvolume "0.4"
sensitivity "4"
viewsize "100"
gl_flashblend "0"
sv_cheats "1"
